api:
  base_url: https://hapi.fhir.org/baseR4
  page_size: 100
  max_pages_per_window: 50   # HAPI public server is huge; cap pages per date window
  timeout_seconds: 60
  max_retries: 5
  backoff_factor: 2
  default_format: json       # json | xml
  watermark_overlap_minutes: 10

storage:
  catalog: fhir
  raw_volume_path: /Volumes/{catalog}/raw/landing   # {catalog} is filled in at runtime

resources:                   # order matters for orchestration
  - name: Patient
    business_key: id
  - name: Encounter
    business_key: id
  - name: Observation
    business_key: id
  - name: Condition
    business_key: id

data_quality:
  # Share of current Silver rows allowed to be NULL. These describe the source data (the public
  # HAPI server holds a lot of incomplete test data), so breaches are WARN and don't fail the run.
  max_null_rate:
    Patient:     {family_name: 0.3, gender: 0.5, birth_date: 0.5}
    Encounter:   {patient_id: 0.05, status: 0.0, period_start: 0.1}
    Observation: {patient_id: 0.05, code: 0.05, effective_datetime: 0.1}
    Condition:   {patient_id: 0.05, code: 0.05, clinical_status: 0.05}
  # Share of Gold facts linked to the Unknown patient (reference to a patient never loaded). WARN.
  max_unknown_patient_rate: 0.1
