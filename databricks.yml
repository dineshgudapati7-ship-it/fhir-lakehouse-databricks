# This is a Declarative Automation Bundle definition for fhir-lakehouse-databricks.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: fhir-lakehouse-databricks

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-5311cbfd-5d84.cloud.databricks.com

